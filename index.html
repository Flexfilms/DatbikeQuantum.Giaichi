function vatLabel(e){
  if(e.vat_status==='has') return 'Có VAT '+e.vat_rate+'%';
  if(e.vat_status==='none') return 'Không VAT';
  return 'Chưa xác định';
}
function buildDetailSheetData(exps){
  var header = ['STT','Ngày','Diễn giải','Danh mục','Số tiền','VAT','Tiền VAT','Tổng tiền','Hóa đơn VAT','Hóa đơn thường','Thanh toán','Người nhập','Link'];
  var rows = exps.map(function(e,i){
    return [i+1, e.date? new Date(e.date+'T00:00:00'): '', e.description, catName(e.category_id), Number(e.amount)||0, vatLabel(e), Number(e.vat_amount)||0,
      Number(e.subtotal||0)+Number(e.vat_amount||0), e.invoice_vat?'Có':'', e.invoice_novat?'Có':'',
      ({paid:'Đã thanh toán',pending:'Đang chờ',unpaid:'Chưa thanh toán'})[e.payment_status]||'Chưa thanh toán',
      e.created_by||'', e.link||''];
  });
  return [header].concat(rows);
}
function styleSheetCommon(ws,ncols){
  ws['!cols'] = [{wch:5},{wch:12},{wch:38},{wch:24},{wch:14},{wch:14},{wch:13},{wch:14},{wch:12},{wch:14},{wch:16},{wch:16},{wch:30}].slice(0,ncols);
  ws['!freeze'] = {xSplit:0,ySplit:1};
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:ncols-1}})};
}
function exportExcel(fullJob){
  if(typeof XLSX==='undefined'){ toast('Không thể tải thư viện Excel, vui lòng thử lại','⚠️'); return; }
  var job = currentJob();
  var exps = fullJob ? currentExpenses() : getFilteredExpenses();
  var wb = XLSX.utils.book_new();

  // Sheet 1: Tổng hợp
  var t = computeTotals(exps);
  var sumAOA = [
    ['PROJECT', job.name],
    ['CLIENT', job.client||''],
    ['PRODUCTION HOUSE', job.production_house||''],
    ['THỜI GIAN', (job.start_date?fmtDate(job.start_date):'')+(job.end_date?' - '+fmtDate(job.end_date):'')],
    ['NGÂN SÁCH', job.budget||0],
    [],
    ['TỔNG CHI', t.total],
    ['CÓ VAT', t.hasVat],
    ['KHÔNG VAT', t.noVat],
    ['TỔNG VAT', t.vatAmt],
    ['THIẾU CHỨNG TỪ', t.missingDoc],
    ['CHƯA THANH TOÁN', t.unpaid],
    ['SỐ KHOẢN CHI', exps.length],
    [],
    ['Ngày xuất', new Date()]
  ];
  var ws1 = XLSX.utils.aoa_to_sheet(sumAOA);
  ws1['!cols']=[{wch:20},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Tổng hợp');

  // Sheet 2: Chi tiết
  var detailAOA = buildDetailSheetData(exps);
  var ws2 = XLSX.utils.aoa_to_sheet(detailAOA);
  styleSheetCommon(ws2, detailAOA[0].length);
  for(var r=1;r<detailAOA.length;r++){
    var amtCell = XLSX.utils.encode_cell({r:r,c:4}); if(ws2[amtCell]) ws2[amtCell].z = '#,##0"₫"';
    var vatCell = XLSX.utils.encode_cell({r:r,c:6}); if(ws2[vatCell]) ws2[vatCell].z = '#,##0"₫"';
    var totCell = XLSX.utils.encode_cell({r:r,c:7}); if(ws2[totCell]) ws2[totCell].z = '#,##0"₫"';
    var dateCell = XLSX.utils.encode_cell({r:r,c:1}); if(ws2[dateCell] && ws2[dateCell].v instanceof Date) ws2[dateCell].z = 'dd/mm/yyyy';
    var linkCell = XLSX.utils.encode_cell({r:r,c:12});
    var e = exps[r-1];
    if(ws2[linkCell] && e && e.link){ ws2[linkCell].l = {Target:e.link}; }
  }
  XLSX.utils.book_append_sheet(wb, ws2, 'Chi tiết');

  // Sheet 3: Theo danh mục
  var cats = currentCategories();
  var byCat = {}; cats.forEach(function(c){ byCat[c.id]={name:c.name,total:0,vat:0,count:0}; });
  byCat['__none__']={name:'(Không danh mục)',total:0,vat:0,count:0};
  exps.forEach(function(e){ var k=e.category_id&&byCat[e.category_id]?e.category_id:'__none__'; byCat[k].total+=Number(e.amount)||0; byCat[k].vat+=Number(e.vat_amount)||0; byCat[k].count++; });
  var catAOA=[['Danh mục','Tổng chi','VAT','Số khoản']];
  Object.keys(byCat).forEach(function(k){ if(byCat[k].count>0) catAOA.push([byCat[k].name, byCat[k].total, byCat[k].vat, byCat[k].count]); });
  catAOA.push(['TỔNG', t.total, t.vatAmt, exps.length]);
  var ws3 = XLSX.utils.aoa_to_sheet(catAOA);
  ws3['!cols']=[{wch:32},{wch:16},{wch:14},{wch:10}];
  ws3['!freeze']={xSplit:0,ySplit:1};
  for(var r3=1;r3<catAOA.length;r3++){
    ['B','C'].forEach(function(col){ var c=col+(r3+1); if(ws3[c]) ws3[c].z='#,##0"₫"'; });
  }
  XLSX.utils.book_append_sheet(wb, ws3, 'Theo danh mục');

  if(fullJob){
    // Sheet 4: Chứng từ (list of attachments)
    var expIds = exps.map(function(e){return e.id;});
    attGetAllForJob(expIds).then(function(map){
      var attAOA=[['Khoản chi','Ngày','Tên file','Loại','Loại file']];
      exps.forEach(function(e){
        (map[e.id]||[]).forEach(function(a){
          attAOA.push([e.description, e.date?fmtDate(e.date):'', a.file_name, ({bill:'Bill/Receipt',vat_invoice:'Hóa đơn VAT',payment_screenshot:'Thanh toán',other:'Khác'})[a.attachment_type]||'Khác', a.file_type||'']);
        });
      });
      if(attAOA.length===1) attAOA.push(['(Không có chứng từ nào)','','','','']);
      var ws4 = XLSX.utils.aoa_to_sheet(attAOA);
      ws4['!cols']=[{wch:34},{wch:12},{wch:24},{wch:16},{wch:20}];
      ws4['!freeze']={xSplit:0,ySplit:1};
      XLSX.utils.book_append_sheet(wb, ws4, 'Chứng từ');
      finishExport(wb, job);
    });
  }else{
    finishExport(wb, job);
  }
}
function finishExport(wb, job){
  var fname = (job.name||'production-cost').replace(/[^\w\-]+/g,'_')+'_'+todayISO()+'.xlsx';
  var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  var blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(Cloud.hasDownloads()){
    Cloud.saveDownload(fname, blob).then(function(){
      toast('Đã xuất file Excel');
    }).catch(function(err){
      var code = err && err.code;
      if(code==='declined'){ toast('Đã hủy xuất file'); }
      else if(code==='rate_limited'){ toast('Vui lòng thử lại sau ít giây','⚠️'); }
      else { toast('Không thể lưu file Excel','⚠️'); }
    });
    return;
  }
  // Fallback for environments without the downloads capability (local
  // preview, standalone file): try a normal browser download.
  try{
    XLSX.writeFile(wb, fname);
    toast('Đã xuất file Excel');
  }catch(e){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
      toast('Đã xuất file Excel');
    }catch(e2){
      console.error('Export failed', e2);
      toast('Không thể xuất file Excel','⚠️');
    }
  }
}


/* ======================================================================
   EXCEL EXPORT V2 — exact data + embedded images + clickable links
   Uses ExcelJS for images because SheetJS Community can write the data but
   does not embed images into .xlsx reliably in a browser-only app.
====================================================================== */
function excelImageData(url){
  return new Promise(function(resolve,reject){
    if(!url){ reject(new Error('empty image')); return; }
    if(url.indexOf('data:')===0){ resolve(url); return; }
    fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      var reader=new FileReader();
      reader.onload=function(){ resolve(reader.result); };
      reader.onerror=reject;
      reader.readAsDataURL(blob);
    }).catch(reject);
  });
}
function excelImageExtension(fileType,fileName){
  var t=(fileType||'').toLowerCase();
  var n=(fileName||'').toLowerCase();
  if(t.indexOf('png')>=0 || n.endsWith('.png')) return 'png';
  if(t.indexOf('webp')>=0 || n.endsWith('.webp')) return 'png';
  return 'jpeg';
}
function excelSafeSheetName(name){
  return String(name||'Sheet').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||'Sheet';
}
function excelStyleHeader(row){

      {header:'VAT',width:14},
      {header:'BILL',width:28},
      {header:'LINK',width:34},
      {header:'HĐ VAT',width:12},
      {header:'HĐ THƯỜNG',width:14},
      {header:'NGƯỜI NHẬP',width:18},
      {header:'THANH TOÁN',width:18}
    ];
    excelStyleHeader(ws.getRow(1));
    ws.getRow(1).height=28;

    var imageJobs=[];
    exps.forEach(function(e,i){
      var atts=attMap[e.id]||[];
      var imageAtts=atts.filter(function(a){return /^image\//i.test(a.file_type||'') && a.file_url;});
      var nonImageAtts=atts.filter(function(a){return !/^image\//i.test(a.file_type||'');});
      var billLines=[];
      atts.forEach(function(a){
        var label=a.file_name||'Chứng từ';
        if(/^image\//i.test(a.file_type||'')) label='🖼 '+label;
        else if(/^application\/pdf$/i.test(a.file_type||'')) label='📄 '+label;
        billLines.push(label);
      });

      var billText=billLines.join('\n');
      var payment=({paid:'Đã thanh toán',pending:'Đang chờ',unpaid:'Chưa thanh toán'})[e.payment_status]||'Chưa thanh toán';
      var row=ws.addRow([
        i+1,
        e.date?new Date(e.date+'T00:00:00'):'',
        e.description||'',
        catName(e.category_id),
        Number(e.amount)||0,
        vatLabel(e),
        billText,
        e.link||'',
        e.invoice_vat?'✓':'',
        e.invoice_novat?'✓':'',
        e.created_by||'',
        payment
      ]);

      excelDate(row.getCell(2));
      excelMoney(row.getCell(5));
      row.alignment={vertical:'middle',wrapText:true};
      row.getCell(1).alignment={vertical:'middle',horizontal:'center'};
      row.getCell(5).alignment={vertical:'middle',horizontal:'right'};
      row.getCell(9).alignment={vertical:'middle',horizontal:'center'};
      row.getCell(10).alignment={vertical:'middle',horizontal:'center'};

      if(e.link){
        row.getCell(8).value={text:e.link,hyperlink:e.link};
        row.getCell(8).font={color:{argb:'FF1565C0'},underline:true};
      }

      /* Keep every attachment on this SAME expense row. */
      if(atts.length){
        row.height=Math.max(72, Math.min(125, 45 + imageAtts.length*35));
      }
      imageAtts.forEach(function(a,j){
        imageJobs.push({
          url:a.file_url,
          fileType:a.file_type,
          fileName:a.file_name,
          row:row.number,
          slot:j
        });
      });

      /* PDFs: keep them clean in the SAME BILL cell.
         Never write the RTDB data URL into Excel — that produces the huge
         data:application/pdf;base64,... text seen in the previous export.
         ExcelJS cannot natively embed a PDF as a cell object. So for a PDF
         stored only in RTDB, show the filename (and a clear PDF marker).
         If the attachment has a real http(s) URL, make that filename a
         clickable hyperlink. */
      if(nonImageAtts.length){
        var pdfLabels = nonImageAtts.map(function(a){
          var label='📄 '+(a.file_name||'Chứng từ PDF');
          var u=String(a.file_url||'');
          if(/^https?:\/\//i.test(u)){
            return {text:label, hyperlink:u};
          }
          return label;
        });
        var billCell=row.getCell(7);
        var existing=String(billCell.value||'');
        var pdfText=pdfLabels.map(function(x){return typeof x==='string'?x:x.text;}).join('\n');
        var combined=existing ? existing+'\n'+pdfText : pdfText;
        /* If there is exactly one external URL, make the whole PDF label
           clickable. Data URLs are deliberately never assigned as Excel
           hyperlinks. */
        var clickable=pdfLabels.length===1 && typeof pdfLabels[0]!=='string' ? pdfLabels[0] : null;
        if(clickable){
          billCell.value=clickable;
          billCell.font={color:{argb:'FF1565C0'},underline:true};
        }else{
          billCell.value=combined;
          billCell.alignment={vertical:'middle',wrapText:true};
        }
      }
    });

    /* Total row — stays in the same table, not another sheet. */
    var t=computeTotals(exps);
    var totalRow=ws.addRow(['','','','TỔNG ('+exps.length+' khoản)',t.total,'VAT: '+fmtVND(t.vatAmt),'','','','','','']);
    totalRow.font={bold:true};
    totalRow.alignment={vertical:'middle'};
    excelMoney(totalRow.getCell(5));
    totalRow.height=26;

    ws.views=[{state:'frozen',ySplit:1}];
    ws.autoFilter={from:'A1',to:'L'+Math.max(1,ws.rowCount-1)};
    ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};
    ws.pageSetup.paperSize=ws.constructor && ws.constructor.PAPERSIZE_A4 ? ws.constructor.PAPERSIZE_A4 : 9;
    ws.headerFooter={oddFooter:'&L'+(job.name||'DATBIKE QUANTUM 2026')+'&RTrang &P / &N'};

    /* Embed images directly into the BILL column of the corresponding row. */
    return Promise.all(imageJobs.map(function(im){
      return excelImageData(im.url).then(function(data){
        try{
          var ext=excelImageExtension(im.fileType,im.fileName);
          var imageId=wb.addImage({base64:data,extension:ext});
          var col=6.05 + ((im.slot%2)*1.25); // BILL column is G (zero-based 6)
          var rowTop=im.row-1;
          ws.addImage(imageId,{tl:{col:col,row:rowTop+0.10},ext:{width:90,height:68}});
        }catch(err){ console.warn('Không thể nhúng ảnh '+im.fileName,err); }
      }).catch(function(err){ console.warn('Không đọc được ảnh '+im.fileName,err); });
    })).then(function(){
      return wb.xlsx.writeBuffer();
    }).then(function(buffer){
      var fname=(job.name||'production-cost').replace(/[^\w\-]+/g,'_')+'_'+todayISO()+'.xlsx';
      var blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      try{
        var url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url;a.download=fname;document.body.appendChild(a);a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
        toast('Đã xuất 1 bảng duy nhất + chứng từ');
      }catch(err){ console.error(err); toast('Không thể tải file Excel','⚠️'); }
    });
  }).catch(function(err){
    console.error('Excel export failed',err);
    toast('Xuất Excel thất bại: '+(err.message||err),'⚠️');
  });
}

// Keep the previous SheetJS exporter as a fallback if ExcelJS is unavailable.
function exportExcelLegacy(fullJob){
  if(typeof XLSX==='undefined'){ toast('Không thể tải thư viện Excel','⚠️'); return; }
  var job=currentJob(); var exps=fullJob?currentExpenses():getFilteredExpenses(); var wb=XLSX.utils.book_new();
  var t=computeTotals(exps);
  var sumAOA=[['PROJECT',job.name],['CLIENT',job.client||''],['PRODUCTION HOUSE',job.production_house||''],['THỜI GIAN',(job.start_date?fmtDate(job.start_date):'')+(job.end_date?' - '+fmtDate(job.end_date):'')],['NGÂN SÁCH',job.budget||0],[],['TỔNG CHI',t.total],['CÓ VAT',t.hasVat],['KHÔNG VAT',t.noVat],['TỔNG VAT',t.vatAmt],['THIẾU CHỨNG TỪ',t.missingDoc],['CHƯA THANH TOÁN',t.unpaid],['SỐ KHOẢN CHI',exps.length],[],['Ngày xuất',new Date()]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sumAOA),'Tổng hợp');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(buildDetailSheetData(exps)),'Chi tiết');
  finishExport(wb,job);
}

var realtimeServicesStarted = false;
function startRealtimeServices(){
  if(realtimeServicesStarted || !getUser()) return;
  realtimeServicesStarted = true;
  Cloud.init().then(function(active){
    if(active){ console.log('Production Cost: đồng bộ realtime đã bật.'); }
  });
  Room.init().then(function(active){
    if(active){
      Room.setPresence({ name:getUser(), jobId:S.jobId, tab:S.tab, editingId:null, color:userColor(getUser()) });
      Room.onPeersChange(function(){ updatePresenceStrip(); applyPresenceOverlay(); });
      updatePresenceStrip();
    }
  });
}

function init(){
  loadDB();
  attLoadFallback();
  try{
    var t = localStorage.getItem(LS_THEME_KEY);
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    else if(t==='light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  seedDemoIfEmpty();
  DB.jobs.forEach(function(j){ if(!j.delete_password_hash) j.delete_password_hash=DEFAULT_DELETE_PASSWORD_HASH; });
  saveDBNow();
  render();
  if(getUser()) startRealtimeServices();
  // Re-render the expense list (table <-> card) when crossing the
  // mobile breakpoint — e.g. rotating a phone/tablet or resizing a window.
  if(MOBILE_MQ){
    var onBreakpointChange = debounce(function(){
      if(S.route==='job' && S.tab==='table'){
        var v = document.getElementById('jobView');
        if(v) renderTableTab(v);
      }
    },150);
    if(MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', onBreakpointChange);
    else if(MOBILE_MQ.addListener) MOBILE_MQ.addListener(onBreakpointChange); // older Safari
  }
}
init();
})();
